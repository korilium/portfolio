services:
  api:
    build: .
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      ALLOWED_ORIGIN: "*"
    ports:
      - "8080:8080"

  web:
    image: nginx:alpine
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
