<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 505" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How a Monte-Carlo agent estimates the value of a state by simulating many careers and averaging their returns">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#60987a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="505" rx="18" fill="#091210"/>

  <text x="450" y="44" text-anchor="middle" fill="#a8d8cf" font-size="22" font-weight="700">Estimating the value of a state</text>
  <text x="450" y="70" text-anchor="middle" fill="#6a8d7e" font-size="14">Monte Carlo: simulate many careers from (s, a), then average their present values</text>

  <!-- STATE + ACTION -->
  <rect x="40" y="120" width="210" height="210" rx="12" fill="#22443e" stroke="#60987a" stroke-width="1"/>
  <text x="145" y="150" text-anchor="middle" fill="#80c3b7" font-size="14" font-weight="700" letter-spacing="0.06em">STATE  s</text>
  <text x="70" y="184" fill="#a8d8cf" font-size="15">year&#160;&#160;=&#160;&#160;t</text>
  <text x="70" y="212" fill="#a8d8cf" font-size="15">reserve&#160;&#160;=&#160;&#160;R<tspan font-size="11" dy="4">t</tspan></text>
  <line x1="62" y1="232" x2="228" y2="232" stroke="#60987a" stroke-width="1" opacity="0.4"/>
  <text x="145" y="262" text-anchor="middle" fill="#80c3b7" font-size="14" font-weight="700" letter-spacing="0.06em">ACTION  a</text>
  <text x="70" y="290" fill="#f0a500" font-size="15">&#9656;&#160;&#160;contribute</text>
  <text x="70" y="314" fill="#6a8d7e" font-size="15">&#9656;&#160;&#160;don&#8217;t</text>

  <!-- arrow state -> fan -->
  <text x="288" y="196" text-anchor="middle" fill="#6a8d7e" font-size="12">follow &#960; to T</text>
  <line x1="250" y1="215" x2="298" y2="215" stroke="#60987a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FAN CONTAINER -->
  <rect x="300" y="100" width="330" height="250" rx="12" fill="none" stroke="#60987a" stroke-width="1" opacity="0.35" stroke-dasharray="5 5"/>
  <text x="465" y="124" text-anchor="middle" fill="#6a8d7e" font-size="12" letter-spacing="0.08em">SIMULATE N CAREERS</text>

  <!-- time guides -->
  <line x1="320" y1="142" x2="320" y2="272" stroke="#60987a" stroke-width="1" opacity="0.3" stroke-dasharray="3 4"/>
  <line x1="520" y1="142" x2="520" y2="272" stroke="#60987a" stroke-width="1" opacity="0.3" stroke-dasharray="3 4"/>
  <text x="320" y="138" text-anchor="middle" fill="#6a8d7e" font-size="12">t</text>
  <text x="520" y="138" text-anchor="middle" fill="#6a8d7e" font-size="12">T</text>

  <!-- rollout 1 -->
  <polyline points="320,160 360,152 400,164 440,150 480,160 520,156" fill="none" stroke="#60987a" stroke-width="1.4"/>
  <circle cx="320" cy="160" r="3" fill="#80c3b7"/>
  <circle cx="520" cy="156" r="5" fill="#055445" stroke="#80c3b7" stroke-width="1.2"/>
  <rect x="536" y="142" width="70" height="28" rx="6" fill="#055445" stroke="#60987a" stroke-width="1"/>
  <text x="571" y="161" text-anchor="middle" fill="#80c3b7" font-size="14">G<tspan font-size="11" dy="4">1</tspan></text>

  <!-- rollout 2 -->
  <polyline points="320,205 360,213 400,200 440,211 480,202 520,208" fill="none" stroke="#60987a" stroke-width="1.4"/>
  <circle cx="320" cy="205" r="3" fill="#80c3b7"/>
  <circle cx="520" cy="208" r="5" fill="#055445" stroke="#80c3b7" stroke-width="1.2"/>
  <rect x="536" y="191" width="70" height="28" rx="6" fill="#055445" stroke="#60987a" stroke-width="1"/>
  <text x="571" y="210" text-anchor="middle" fill="#80c3b7" font-size="14">G<tspan font-size="11" dy="4">2</tspan></text>

  <!-- rollout 3 -->
  <polyline points="320,250 360,244 400,256 440,246 480,254 520,248" fill="none" stroke="#60987a" stroke-width="1.4"/>
  <circle cx="320" cy="250" r="3" fill="#80c3b7"/>
  <circle cx="520" cy="248" r="5" fill="#055445" stroke="#80c3b7" stroke-width="1.2"/>
  <rect x="536" y="234" width="70" height="28" rx="6" fill="#055445" stroke="#60987a" stroke-width="1"/>
  <text x="571" y="253" text-anchor="middle" fill="#80c3b7" font-size="14">G<tspan font-size="11" dy="4">3</tspan></text>

  <text x="465" y="300" text-anchor="middle" fill="#6a8d7e" font-size="18" letter-spacing="0.2em">&#8942;</text>
  <text x="465" y="326" text-anchor="middle" fill="#6a8d7e" font-size="11">each career &#8594; one return G<tspan font-size="9" dy="3">i</tspan></text>

  <!-- converging arrows -->
  <line x1="608" y1="156" x2="668" y2="192" stroke="#60987a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="608" y1="205" x2="668" y2="205" stroke="#60987a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="608" y1="248" x2="668" y2="218" stroke="#60987a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- ESTIMATE -->
  <rect x="672" y="150" width="188" height="112" rx="12" fill="#22443e" stroke="#f0a500" stroke-width="2"/>
  <text x="766" y="186" text-anchor="middle" fill="#a8d8cf" font-size="15">Q&#8202;(s,&#160;a)&#160;&#160;&#8776;</text>
  <text x="766" y="220" text-anchor="middle" fill="#f0a500" font-size="19" font-weight="700">(1/N)&#160;&#931;&#160;G<tspan font-size="12" dy="5">i</tspan></text>
  <text x="766" y="244" text-anchor="middle" fill="#6a8d7e" font-size="11">sample mean of returns</text>

  <!-- FORMULA BAND -->
  <line x1="40" y1="382" x2="860" y2="382" stroke="#60987a" stroke-width="1" opacity="0.3"/>
  <text x="450" y="412" text-anchor="middle" fill="#6a8d7e" font-size="13">Each career yields one return&#160;&#160;G = discounted sum of rewards&#160;&#160;(its APV).</text>
  <text x="450" y="450" text-anchor="middle" fill="#a8d8cf" font-size="17">Q&#8202;(s,&#160;a)&#160;&#160;&#8592;&#160;&#160;Q&#8202;(s,&#160;a)&#160;&#160;+&#160;&#160;<tspan fill="#f0a500">&#945;</tspan>&#160;&#183;&#160;[&#160;G&#160;&#8722;&#160;Q&#8202;(s,&#160;a)&#160;]</text>
  <text x="450" y="478" text-anchor="middle" fill="#6a8d7e" font-size="11">constant step size &#945; keeps early-training noise from dominating the estimate</text>
</svg>
