server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the DP payload is ~0.5 MB of JSON (full-resolution policy maps) and compresses ~5x
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Without an explicit header browsers cache heuristically and keep serving
    # stale JS/CSS after an edit. "no-cache" still caches, but revalidates first
    # (cheap: nginx answers 304 from the ETag).
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
    }
}
